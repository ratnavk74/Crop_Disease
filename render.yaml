services:
  - type: web
    name: cropshield-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-server.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180 --access-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
    healthCheckPath: /login
